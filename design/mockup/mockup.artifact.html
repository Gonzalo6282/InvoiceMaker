<title>Invoice Maker Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;600;700&display=swap">
<style>
/* Layout: control rail on the left, a real-size device frame (iPhone / iPad) scaled to fit on the right.
   Design system "Ledger Indigo": Stripe colour discipline (indigo action, midnight ink, frost hairlines),
   Wise elements (pill buttons, heavy display figures, 28pt hero cards, tinted status tags), Apple HIG structure. */
:root{
  --ink:#061b31;          /* midnight ink: primary text */
  --ink-2:#50617a;        /* steel: secondary text */
  --ink-3:#7d8ca3;        /* tertiary, placeholders */
  --line:#e3e9f2;         /* frost hairline */
  --canvas:#f3f6fa;       /* grouped background */
  --surface:#ffffff;      /* rows, cards */
  --surface-2:#f8fafd;    /* mist: inset fields */
  --brand:#533afd;        /* indigo ink: the single action colour */
  --brand-press:#4128e0;
  --brand-wash:#eceaff;   /* periwinkle wash */
  --brand-edge:#b9b9f9;   /* lavender ghost border */
  --navy:#0a2540;         /* hero money card */
  --navy-ink:#ffffff;
  --paid:#9fe870;         /* lime: money arrived */
  --paid-ink:#163300;
  --paid-wash:#e2f6d5;
  --paid-text:#163300;    /* paid-coloured text/icons on paid-wash */
  --item-tile:#ffe4c4;    /* saved-item tiles: pastel peach */
  --item-ink:#c4610f;     /* deeper orange tag */
  --chip-bg:var(--brand-wash);  /* violet icon chips (client initials, empty-state icons) */
  --chip-ink:var(--brand);
  --due:#df1b41;          /* overdue */
  --due-wash:#ffe6eb;
  --warn:#b25e09;
  --warn-wash:#fff1dc;
  --teal:#0fb5c8;
  --frame:#0c0f16;
  --rail:#ffffff;
  --rail-bg:#eef2f7;
  --shadow:0 1px 0 rgba(6,27,49,.04);
  --sheet-dim:rgba(6,27,49,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paid-text:#9fe870;
  --item-tile:#ffb870;--item-ink:#3b2a17;
  --chip-bg:#8f82ff;--chip-ink:#15123a;
  --ink:#eef2f8;--ink-2:#a7b3c6;--ink-3:#6f7d93;--line:#1e2a3d;--canvas:#05090f;--surface:#0f1726;--surface-2:#141e30;
  --brand:#7b6bff;--brand-press:#6a58ff;--brand-wash:#1c1a45;--brand-edge:#3b3680;--navy:#111d36;--navy-ink:#ffffff;
  --paid-wash:#1b2e12;--due:#ff5d7a;--due-wash:#3a0f19;--warn:#f0a646;--warn-wash:#33230c;--rail:#0e1522;--rail-bg:#070b12;
  --sheet-dim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --paid-text:#9fe870;
  --item-tile:#ffb870;--item-ink:#3b2a17;
  --chip-bg:#8f82ff;--chip-ink:#15123a;
  --ink:#eef2f8;--ink-2:#a7b3c6;--ink-3:#6f7d93;--line:#1e2a3d;--canvas:#05090f;--surface:#0f1726;--surface-2:#141e30;
  --brand:#7b6bff;--brand-press:#6a58ff;--brand-wash:#1c1a45;--brand-edge:#3b3680;--navy:#111d36;--navy-ink:#ffffff;
  --paid-wash:#1b2e12;--due:#ff5d7a;--due-wash:#3a0f19;--warn:#f0a646;--warn-wash:#33230c;--rail:#0e1522;--rail-bg:#070b12;
  --sheet-dim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--rail-bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- page shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1640px;margin:0 auto;padding-block:16px}
.rail{background:var(--rail);border:1px solid var(--line);border-radius:20px;padding:18px;align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.rail h1{font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
.rail .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px;line-height:1.4}
.rail h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.seg{display:flex;background:var(--canvas);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(6,27,49,.12)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.jump button:hover{border-color:var(--brand-edge);color:var(--brand)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px}
.events{font-size:12px;color:var(--ink-2);display:grid;gap:4px;margin:0;padding:0;list-style:none}
.events li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.events code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-size:11.5px}
.stage{min-width:0;display:flex;justify-content:center;align-items:flex-start}
.stage-box{position:relative}
.stage-note{color:var(--ink-2);font-size:12.5px;text-align:center;margin-top:10px}

/* switch */
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:#c8d1de;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:#34c759}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- device ---------- */
.device{transform-origin:top left;background:var(--frame);position:relative}
.device.iphone{width:402px;height:874px;border-radius:62px;padding:11px}
.device.ipad-l{width:1210px;height:850px;border-radius:40px;padding:15px}
.device.ipad-p{width:850px;height:1210px;border-radius:40px;padding:15px}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--canvas);border-radius:52px;isolation:isolate;container-type:size}
.device.ipad-l .screen,.device.ipad-p .screen{border-radius:26px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:600;font-size:16px;z-index:50;pointer-events:none}
.device.ipad-l .statusbar,.device.ipad-p .statusbar{height:28px;padding:2px 22px 0;font-size:13px}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:80;pointer-events:none}

/* ---------- iOS screen anatomy ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.nav{flex:none;padding:54px 16px 0;background:var(--canvas)}
.ipad .nav{padding-top:30px}
.navrow{height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.navrow .title{font-weight:600;font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{color:var(--brand);font-size:17px;display:inline-flex;align-items:center;gap:2px;min-width:44px;min-height:44px}
.navbtn.r{justify-content:flex-end}
.navbtn.strong{font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.large{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.025em;margin:2px 0 10px}
.body{flex:1;overflow:auto;padding:0 0 24px;overscroll-behavior:contain}
.body.pad{padding:0 16px 24px}
.readable{max-width:680px;margin:0 auto;width:100%}
.tabbar{flex:none;height:84px;display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);padding:7px 6px 30px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-3)}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar svg{width:26px;height:26px}

.section-h{font-size:13px;color:var(--ink-2);margin:22px 16px 7px;font-weight:500}
.section-f{font-size:12.5px;color:var(--ink-2);margin:7px 16px 0;line-height:1.4}
.group{background:var(--surface);border-radius:14px;margin:0 16px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;width:100%;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .lbl{font-size:16px}
.row .meta{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--ink-2);font-size:15px;text-align:right;white-space:nowrap}
.row .chev{color:var(--ink-3);flex:none}
.row.danger .lbl{color:var(--due)}
.row.link .lbl{color:var(--brand)}
.row input,.row select,.row textarea{border:0;background:transparent;outline:0;font-size:16px;text-align:right;min-width:0;flex:1;padding:0}
.row textarea{text-align:left;resize:none;min-height:60px;line-height:1.4}
.row input::placeholder,.row textarea::placeholder{color:var(--ink-3)}
.row .k{font-size:16px;flex:none;color:var(--ink)}
.sicon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.sicon svg{width:18px;height:18px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--chip-bg);color:var(--chip-ink);flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:600;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-press)}
.btn.ghost{border:1.5px solid var(--brand-edge);color:var(--brand);background:var(--surface)}
.btn.plain{color:var(--brand);height:44px}
.btn.dark{background:#000;color:#fff}
.btn.danger{background:var(--due);color:#fff}
.btn.sm{height:36px;font-size:15px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}

/* status pills */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.draft{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line)}
.pill.sent{background:var(--brand-wash);color:var(--brand)}
.pill.paid{background:var(--paid);color:var(--paid-ink)}
.pill.overdue{background:var(--due-wash);color:var(--due)}
.pill.accepted{background:var(--paid-wash);color:var(--paid-ink)}
:root[data-theme="dark"] .pill.accepted{color:var(--paid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.accepted{color:var(--paid)}}
.pill.converted{background:var(--canvas);color:var(--ink-3);border:1px solid var(--line)}

/* home hero */
.money{margin:4px 16px 0;background:var(--navy);color:var(--navy-ink);border-radius:28px;padding:20px 20px 18px;display:grid;gap:14px}
.money .lab{font-size:13px;opacity:.72}
.money .big{font-family:var(--font-display);font-size:40px;font-weight:900;letter-spacing:-.035em;line-height:1}
.money .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.money .mid{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.money .mid.lime{color:var(--paid)}
.money .mid.red{color:#ff8fa3}
.money .foot{font-size:12px;opacity:.6}

.tabs{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.typeseg{margin:0 16px;display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:10px;padding:2px}
.typeseg button{flex:1;height:32px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.typeseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(6,27,49,.12)}
.search{margin:0 16px 4px;display:flex;align-items:center;gap:8px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:0 10px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:16px;color:var(--ink)}
.docrow{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;position:relative}
.docrow + .docrow::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--line)}
.docrow .amt{font-weight:700;font-size:16px;text-align:right}
.docrow .r{display:grid;justify-items:end;gap:4px}
.docrow[aria-current="true"]{background:var(--brand-wash)}

.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:48px 32px}
.empty h3{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.empty p{color:var(--ink-2);margin:0;line-height:1.45;max-width:300px}
.banner{margin:10px 16px 0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.banner.warn{background:var(--warn-wash);color:var(--warn)}
.banner.info{background:var(--brand-wash);color:var(--brand)}
.banner.ok{background:var(--paid-wash);color:var(--paid-ink)}
:root[data-theme="dark"] .banner.ok{color:var(--paid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.ok{color:var(--paid)}}
.banner.err{background:var(--due-wash);color:var(--due)}
.banner b{font-weight:600}
.banner .act{margin-left:auto;font-weight:600;white-space:nowrap;text-decoration:underline}

/* editor */
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 16px 0}
.ed-head .no{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.025em}
.saved{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.line{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;width:100%;text-align:left;position:relative}
.line + .line::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.line .d{font-size:16px;font-weight:500}
.line .m{font-size:13px;color:var(--ink-2);margin-top:3px}
.line .t{font-weight:600;font-size:16px;margin-left:auto;white-space:nowrap}
.totals{padding:6px 14px 12px}
.totals .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;color:var(--ink-2)}
.totals .tr.total{color:var(--ink);font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:11px}
.totals .tr.total .num{font-family:var(--font-display);font-size:24px;font-weight:900;letter-spacing:-.03em}
.ed-actions{flex:none;display:flex;gap:10px;padding:10px 16px 30px;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.ipad .ed-actions{padding-bottom:14px}
.ed-actions .btn{height:50px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand-wash);border-color:var(--brand-edge);color:var(--brand)}
.err-text{color:var(--due);font-size:13px;margin:8px 16px 0}

/* ---------- invoice paper (stand-in for the UIGraphicsPDFRenderer templates) ---------- */
.paperwrap{container-type:inline-size;width:100%}
.paper{--acc:#533afd;position:relative;background:#fff;color:#14202e;aspect-ratio:1/1.4142;width:100%;border-radius:4px;box-shadow:0 1px 2px rgba(6,27,49,.08),0 8px 28px rgba(6,27,49,.10);padding:6.5cqw 6.5cqw 5cqw;font-family:"Inter",var(--font);font-size:2.05cqw;line-height:1.38;overflow:hidden;display:flex;flex-direction:column}
.paper *{color:inherit}
.paper .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4cqw}
.paper .p-logo{width:11cqw;height:11cqw;border-radius:2.2cqw;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:4cqw;letter-spacing:-.04em;overflow:hidden;flex:none}
.paper .p-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.paper .p-title{font-weight:800;font-size:5.6cqw;letter-spacing:-.03em;line-height:1;color:var(--acc);text-align:right}
.paper .p-sub{color:#5b6878;text-align:right;margin-top:1cqw}
.paper .p-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3cqw;margin-top:5cqw}
.paper .p-k{font-size:1.65cqw;color:#7a8696;font-weight:600;margin-bottom:.6cqw}
.paper .p-b{font-weight:600}
.paper table{width:100%;border-collapse:collapse;margin-top:5cqw;font-variant-numeric:tabular-nums}
.paper th{font-size:1.65cqw;color:#7a8696;font-weight:600;text-align:left;padding:1.2cqw 0;border-bottom:.25cqw solid #14202e}
.paper td{padding:1.6cqw 0;border-bottom:.15cqw solid #e6ebf1;vertical-align:top}
.paper th.n,.paper td.n{text-align:right;padding-left:2cqw}
.paper .p-sumwrap{display:flex;justify-content:flex-end;margin-top:2.5cqw}
.paper .p-sum{width:48%;font-variant-numeric:tabular-nums}
.paper .p-sum div{display:flex;justify-content:space-between;padding:.7cqw 0;color:#4d5a6a}
.paper .p-sum .p-tot{color:#14202e;font-weight:800;font-size:3.1cqw;letter-spacing:-.02em;border-top:.25cqw solid #14202e;margin-top:1cqw;padding-top:1.6cqw}
.paper .p-pay{margin-top:auto;display:flex;gap:4cqw;align-items:flex-end;border-top:.15cqw solid #e6ebf1;padding-top:3cqw}
.paper .p-btns{display:flex;flex-wrap:wrap;gap:1.2cqw;margin-top:1.4cqw}
.paper .p-btn{background:var(--acc);color:#fff;border-radius:99cqw;padding:.9cqw 2.4cqw;font-weight:700;font-size:1.75cqw}
.paper .p-qr{width:14cqw;height:14cqw;flex:none}
.paper .p-notes{color:#5b6878;margin-top:3cqw}
.paper .p-sig{height:6cqw;margin-top:1cqw}
.paper .p-sig img,.paper .p-sig svg{height:100%;width:auto}
.paper .stamp{position:absolute;top:30%;right:8%;transform:rotate(-14deg);border:.6cqw solid #3d8a1b;color:#3d8a1b;font-weight:900;font-size:8cqw;letter-spacing:.06em;padding:.5cqw 3cqw;border-radius:2cqw;opacity:.85;mix-blend-mode:multiply}
.paper .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.paper .wm span{transform:rotate(-30deg);font-size:15cqw;font-weight:900;letter-spacing:.08em;color:rgba(83,58,253,.08)}
/* template variations */
.paper.t-bold{padding-top:0}
.paper.t-bold .p-band{background:var(--acc);color:#fff;margin:0 -6.5cqw;padding:6cqw 6.5cqw 5cqw;display:flex;justify-content:space-between;align-items:flex-end}
.paper.t-bold .p-band .p-title{color:#fff;font-size:7cqw}

const LOCALE = () => (PRESETS[D().biz.country] || PRESETS.UK).locale;
function money(n, ccy) {
  ccy = ccy || D().biz.currency;
  const mode = D().biz.currencyDisplay;
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  if (mode === 'none') return new Intl.NumberFormat(LOCALE(), {minimumFractionDigits:2, maximumFractionDigits:2}).format(v);
  return new Intl.NumberFormat(LOCALE(), {style:'currency', currency:ccy, currencyDisplay: mode === 'code' ? 'code' : 'narrowSymbol'}).format(v);
}
const fdate = (iso, opts = {day:'numeric',month:'short',year:'numeric'}) => iso ? new Intl.DateTimeFormat(LOCALE(), opts).format(new Date(iso + 'T12:00:00Z')) : '';
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

/* The same arithmetic the Swift InvoiceCalculator will implement (and unit-test). */
function calc(doc) {
  const taxes = D().taxes;
  const lines = doc.items.map(it => {
    const gross = (+it.qty || 0) * (+it.rate || 0);
    const d = it.discType === '%' ? gross * (+it.disc || 0) / 100 : Math.min(+it.disc || 0, gross);
    return { ...it, gross, net: gross - d, lineDisc: d };
  });
  const sub = lines.reduce((a, l) => a + l.net, 0);
  const dv = +doc.discount.value || 0;
  const docDisc = doc.discount.type === '%' ? sub * dv / 100 : Math.min(dv, sub);
  const factor = sub ? (sub - docDisc) / sub : 0;
  const bucket = {};
  const addTax = (ids, base) => {
    const rs = ids.map(id => taxes.find(t => t.id === id)).filter(Boolean);
    const sumR = rs.reduce((a, t) => a + t.rate, 0) / 100;
    rs.forEach(t => {
      const amt = doc.taxMode === 'incl' ? base * (t.rate / 100) / (1 + sumR) : base * t.rate / 100;
      const k = t.id; bucket[k] = bucket[k] || { name:t.name, rate:t.rate, amount:0, base:0 };
      bucket[k].amount += amt; bucket[k].base += base;
    });
  };
  if (doc.taxWhere === 'item') lines.forEach(l => addTax(l.taxIds || [], l.net * factor));
  else addTax(doc.totalTaxIds || [], sub - docDisc);
  const taxList = Object.values(bucket).filter(t => t.rate > 0 || t.base > 0).map(t => ({ ...t, amount: r2(t.amount) }));
  const taxSum = taxList.reduce((a, t) => a + t.amount, 0);
  const fees = (doc.fees || []).reduce((a, f) => a + (+f.amount || 0), 0);
  const ship = +doc.shipping || 0;
  const afterDisc = r2(sub - docDisc);
  const total = r2(doc.taxMode === 'incl' ? afterDisc + ship + fees : afterDisc + taxSum + ship + fees);
  return { lines, sub: r2(sub), docDisc: r2(docDisc), taxList, taxSum: r2(taxSum), ship, fees, total };
}

function statusOf(doc) {
  if (doc.type === 'invoice' && doc.status === 'sent' && doc.due < TODAY) return 'overdue';
  return doc.status;

const STATUS_LABEL = { draft:'Draft', sent:'Sent', paid:'Paid', overdue:'Overdue', accepted:'Accepted', converted:'Invoiced' };
function dueText(doc) {
  const st = statusOf(doc);
  if (doc.type === 'receipt') return 'Paid ' + fdate(doc.paidOn, {day:'numeric',month:'short'});
  if (st === 'paid') return 'Paid ' + fdate(doc.paidOn, {day:'numeric',month:'short'});
  if (st === 'overdue') { const n = daysBetween(doc.due, TODAY); return `Overdue by ${n} day${n === 1 ? '' : 's'}`; }
  if (doc.type === 'estimate') return st === 'accepted' ? 'Signed by ' + (doc.signedName || 'client') : st === 'converted' ? 'Turned into an invoice' : 'Valid until ' + fdate(doc.due, {day:'numeric',month:'short'});
  if (st === 'draft') return 'Not sent yet';
  const n = daysBetween(TODAY, doc.due);
  return n === 0 ? 'Due today' : `Due in ${n} day${n === 1 ? '' : 's'}`;
}

/* ---------------- pseudo QR (visual stand-in; the app uses CIQRCodeGenerator) ---------------- */
function qrSVG(text) {
  const n = 25; let h = 2166136261;
  for (const ch of text) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  let r = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#14202e"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#14202e"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" class="p-qr" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="#14202e">${r}</g>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

const inRow = (k, bind, value, { type = 'text', ph = '', mode = '', id = '' } = {}) =>
  `<label class="row"><span class="k">${esc(k)}</span><input id="${id || 'f-' + bind.replace(/[^a-z0-9]/gi, '-')}" type="${type}" ${mode ? `inputmode="${mode}"` : ''} placeholder="${esc(ph)}" value="${esc(value)}" data-in="${esc(bind)}"></label>`;
const avatar = (name) => `<span class="avatar">${esc((name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>`;

/* ===================================================================
   SCREENS
   =================================================================== */
function scrDocs() {
  const all = visibleDocs().filter(d => d.type === S.docType);
  const q = S.q.trim().toLowerCase();
  let list = all.filter(d => !q || d.number.toLowerCase().includes(q) || (clientById(d.clientId)?.name || '').toLowerCase().includes(q));
  const f = S.filter;
  if (f === 'unpaid') list = list.filter(d => ['sent','overdue'].includes(statusOf(d)));
  if (f === 'paid') list = list.filter(d => ['paid','accepted'].includes(statusOf(d)));
  if (f === 'draft') list = list.filter(d => d.status === 'draft');
  if (f === 'overdue') list = list.filter(d => statusOf(d) === 'overdue');
  const b = D().biz;
  const inv = visibleDocs().filter(d => d.type === 'invoice');
  const own = inv.filter(d => clientCcy(d) === b.currency);
  const owed = own.filter(d => ['sent','overdue'].includes(statusOf(d))).reduce((a, d) => a + calc(d).total, 0);
  const overdue = own.filter(d => statusOf(d) === 'overdue').reduce((a, d) => a + calc(d).total, 0);
  const paidMonth = own.filter(d => d.status === 'paid' && d.paidOn && d.paidOn.slice(0, 7) === TODAY.slice(0, 7)).reduce((a, d) => a + calc(d).total, 0);
  const other = inv.filter(d => clientCcy(d) !== b.currency && ['sent','overdue'].includes(statusOf(d)));
  const typeName = { invoice:'Invoices', estimate: b.country === 'UK' ? 'Quotes' : 'Estimates', receipt:'Receipts' };
  const hero = S.docType === 'invoice' && !S.empty ? `<div class="money">
      <div><div class="lab">Owed to you</div><div class="big num">${money(owed)}</div></div>
      <div class="split"><div><div class="lab">Paid in ${fdate(TODAY,{month:'long'})}</div><div class="mid lime num">${money(paidMonth)}</div></div><div><div class="lab">Overdue</div><div class="mid ${overdue ? 'red' : ''} num">${money(overdue)}</div></div></div>
      ${other.length ? `<div class="foot">Plus ${other.map(d => money(calc(d).total, clientCcy(d))).join(', ')} owed in other currencies</div>` : ''}
    </div>` : '';
  const filters = S.docType === 'invoice' ? [['all','All'],['unpaid','Unpaid'],['overdue','Overdue'],['paid','Paid'],['draft','Drafts']] : S.docType === 'estimate' ? [['all','All'],['draft','Drafts'],['paid','Accepted']] : [];
  const rows = list.map(d => {
    const c = clientById(d.clientId) || {};
    const st = statusOf(d);
    const sel = isPad() && cur() && cur().id === d.id;
    return `<button class="docrow" data-act="openDoc" data-arg="${d.id}" ${sel ? 'aria-current="true"' : ''}>${avatar(c.name)}<span class="grow" style="flex:1;min-width:0"><div class="lbl" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name || 'No client')}</div><div class="meta" style="font-size:13px;color:var(--ink-2)">${esc(d.number)} · ${esc(dueText(d))}</div></span><span class="r"><span class="amt num">${money(calc(d).total, clientCcy(d))}</span><span class="pill ${st}">${STATUS_LABEL[st]}</span></span></button>`;
  }).join('');
  const emptyAll = all.length === 0;
  const emptyMsg = emptyAll ? `<div class="empty"><span class="avatar" style="width:64px;height:64px">${ic(S.docType === 'receipt' ? 'receipt' : S.docType === 'estimate' ? 'estimate' : 'doc', 30)}</span>
      <h3>${S.docType === 'invoice' ? 'Create your first invoice' : S.docType === 'estimate' ? 'No ' + typeName.estimate.toLowerCase() + ' yet' : 'No receipts yet'}</h3>
      <p>${S.docType === 'receipt' ? 'Mark an invoice as paid and send a receipt. It appears here.' : 'It takes about a minute. Creating and previewing is free; sending needs Premium.'}</p>
      ${S.docType !== 'receipt' ? `<button class="btn primary" style="width:auto;margin-top:6px" data-act="newDoc" data-arg="${S.docType}">${ic('plus', 20, 2.4)}New ${S.docType === 'estimate' ? typeName.estimate.toLowerCase().replace(/s$/, '') : 'invoice'}</button>` : ''}</div>`
    : (list.length ? '' : `<div class="empty"><p>Nothing matches. Try another filter or search.</p></div>`);
  const right = `<button class="iconbtn" data-act="newMenu" aria-label="New">${ic('plus', 20, 2.4)}</button>`;
  return `<div class="scr" data-scroll="docs">${nav({ large: typeName[S.docType], right })}
    <div class="body" data-scroll-el="docs">
      <div class="typeseg" role="group" aria-label="Document type">${['invoice','estimate','receipt'].map(t => `<button aria-pressed="${S.docType === t}" data-act="docType" data-arg="${t}">${typeName[t]}</button>`).join('')}</div>
      ${S.icloudOff ? `<div class="banner warn">${ic('cloud', 20)}<div><b>iCloud backup is off.</b> Your invoices are only on this iPhone. Turn on iCloud for Invoice Maker in Settings so a new phone gets them back.</div></div>` : ''}
      <div style="height:12px"></div>${hero}
      ${!emptyAll ? `<div style="height:12px"></div><label class="search">${ic('search', 18)}<input id="search-docs" placeholder="Search clients or numbers" value="${esc(S.q)}" data-in="ui:q"></label>
      ${filters.length ? `<div class="tabs" role="group" aria-label="Filter">${filters.map(([k, l]) => `<button aria-pressed="${S.filter === k}" data-act="filter" data-arg="${k}">${l}</button>`).join('')}</div>` : ''}
      <div style="height:8px"></div>${list.length ? `<div class="group">${rows}</div>` : ''}` : ''}
      ${emptyMsg}
    </div></div>`;
}

function editorBody(doc) {
  const c = clientById(doc.clientId);
  const ccy = clientCcy(doc);
  const k = calc(doc);
  const st = statusOf(doc);
  const err = S.errors[doc.id] || {};
  const typeLbl = doc.type === 'estimate' ? docTitle(doc).toLowerCase() : doc.type;
  const banners = [];
  if (doc.type === 'invoice' && st === 'paid') banners.push(`<div class="banner ok">${ic('check', 20, 2.4)}<div><b>Paid on ${fdate(doc.paidOn)}.</b> Send a receipt so your client has proof.</div><button class="act" data-act="makeReceipt">Send receipt</button></div>`);
  else if (doc.status === 'sent' && doc.sentAt) banners.push(`<div class="banner info">${ic('send', 20)}<div><b>Sent on ${fdate(doc.sentAt)}.</b> Changes save automatically. Send again so ${esc(c?.contact || c?.name || 'your client')} has the latest version.</div></div>`);
  if (doc.type === 'estimate' && doc.status === 'accepted') banners.push(`<div class="banner ok">${ic('pen', 20)}<div><b>Accepted.</b> Signed by ${esc(doc.signedName || 'your client')}.</div><button class="act" data-act="convert">Turn into invoice</button></div>`);
  if (doc.type === 'invoice' && doc.clientSig) banners.push(`<div class="banner ok">${ic('pen', 20)}<div><b>Signed by ${esc(doc.signedName || 'your client')}</b> on ${fdate(doc.signedOn)}. The signature is on the PDF.</div></div>`);
  if (doc.type === 'estimate' && doc.status === 'converted') banners.push(`<div class="banner info">${ic('convert', 20)}<div>This ${esc(typeLbl)} was turned into an invoice.</div></div>`);
  const lines = k.lines.map(l => `<button class="line" data-act="editLine" data-arg="${l.id}"><span style="flex:1;min-width:0"><div class="d">${esc(l.desc || 'Untitled item')}</div><div class="m num">${+l.qty} ${esc(l.unit || '')} × ${money(+l.rate || 0, ccy)}${l.lineDisc ? ` · −${l.discType === '%' ? l.disc + '%' : money(+l.disc, ccy)}` : ''}${(l.taxIds||[]).length ? ' · ' + l.taxIds.map(id => { const t = taxById(id); return t ? `${t.name} ${t.rate}%` : ''; }).join(' + ') : ' · No tax'}</div></span><span class="t num">${money(l.net, ccy)}</span></button>`).join('');
  return `
    <div class="ed-head"><div><div class="saved" data-live="saved">${ic('check', 14, 2.6)} Saved</div><div class="no">${esc(doc.number)}</div></div><span class="pill ${st}" style="margin-bottom:6px">${STATUS_LABEL[st]}</span></div>
    ${banners.join('')}
    <div class="section-h">${doc.type === 'estimate' ? 'For' : 'Bill to'}</div>
    <div class="group">${c ? row({ lbl: esc(c.name), meta: esc([c.email, c.currency !== D().biz.currency ? 'Billed in ' + c.currency : ''].filter(Boolean).join(' · ')), act:'pickClient' }) : row({ icon:'person', lbl:'Add client', act:'pickClient', cls:'link' })}</div>
    ${err.client ? `<div class="err-text">Add a client before sending.</div>` : ''}
    <div class="section-h">Details</div>
    <div class="group">
      ${inRow('Number', 'doc:number', doc.number)}
      <label class="row"><span class="k">${doc.type === 'receipt' ? 'Paid on' : 'Issued'}</span><input id="f-issue" type="date" value="${doc.type === 'receipt' ? doc.paidOn : doc.issue}" data-in="doc:${doc.type === 'receipt' ? 'paidOn' : 'issue'}"></label>
      ${doc.type !== 'receipt' ? `<label class="row"><span class="k">${doc.type === 'estimate' ? 'Valid until' : 'Due'}</span><input id="f-due" type="date" value="${doc.due}" data-in="doc:due"></label>` : ''}
      ${inRow('Job or site', 'doc:job', doc.job, { ph:'Optional' })}
    </div>
    <div class="section-h">Items</div>
    <div class="group">${lines}${row({ icon:'plus', lbl:'Add item', act:'addLine', cls:'link', chev:false })}${visibleItems().length ? row({ icon:'tag', color:'var(--item-tile)', ink:'var(--item-ink)', lbl:'Add from saved items', act:'pickSaved', cls:'link' }) : ''}</div>
    ${err.items ? `<div class="err-text">Add at least one item with a price.</div>` : ''}
    <div class="section-h">Tax and discount</div>
    <div class="group">
      <div class="row"><span class="k grow">Prices</span><div class="chips"><button class="chip" aria-pressed="${doc.taxMode === 'excl'}" data-act="taxMode" data-arg="excl">Tax added</button><button class="chip" aria-pressed="${doc.taxMode === 'incl'}" data-act="taxMode" data-arg="incl">Tax included</button></div></div>
      <div class="row"><span class="k grow">Apply tax</span><div class="chips"><button class="chip" aria-pressed="${doc.taxWhere === 'item'}" data-act="taxWhere" data-arg="item">Per item</button><button class="chip" aria-pressed="${doc.taxWhere === 'total'}" data-act="taxWhere" data-arg="total">On total</button></div></div>
      ${doc.taxWhere === 'total' ? `<div class="row" style="flex-wrap:wrap"><span class="k" style="width:100%">Taxes on the total</span><div class="chips">${D().taxes.map(t => `<button class="chip" aria-pressed="${doc.totalTaxIds.includes(t.id)}" data-act="toggleTotalTax" data-arg="${t.id}">${esc(t.name)} ${t.rate}%</button>`).join('')}</div></div>` : ''}
      <label class="row"><span class="k">Discount</span><input id="f-disc" inputmode="decimal" value="${doc.discount.value || ''}" placeholder="0" data-in="doc:discount.value"><div class="chips" style="flex:none"><button class="chip" aria-pressed="${doc.discount.type === '%'}" data-act="discType" data-arg="%">%</button><button class="chip" aria-pressed="${doc.discount.type === 'amt'}" data-act="discType" data-arg="amt">${ccy}</button></div></label>
      ${inRow('Shipping', 'doc:shipping', doc.shipping || '', { ph:'0.00', mode:'decimal' })}
      ${(doc.fees || []).map((f, i) => `<div class="row"><input id="f-feename-${i}" style="text-align:left" value="${esc(f.name)}" placeholder="Fee name" data-in="fee:${i}:name"><input id="f-feeamt-${i}" inputmode="decimal" style="max-width:110px" value="${f.amount || ''}" placeholder="0.00" data-in="fee:${i}:amount"><button aria-label="Remove fee" data-act="rmFee" data-arg="${i}" style="color:var(--due)">${ic('x', 18, 2.2)}</button></div>`).join('')}
      ${row({ icon:'plus', lbl:'Add a fee', act:'addFee', cls:'link', chev:false })}
    </div>
    <div class="group" style="margin-top:12px" data-live="totals">${totalsHTML(doc)}</div>
    <div class="section-h">Notes</div>
    <div class="group"><label class="row"><textarea id="f-notes" rows="3" data-in="doc:notes" placeholder="Payment terms, thank-you note">${esc(doc.notes)}</textarea></label></div>
    ${doc.type === 'invoice' ? `<div class="section-h">Getting paid</div><div class="group">${row({ icon:'qr', color:'#0a2540', lbl:'Payment details on this invoice', meta: esc(paySummary()), act:'push', arg:'set-pay' })}</div><div class="section-f">Your bank details, links and a QR code appear on the PDF. Clients pay you directly; mark the invoice paid when the money arrives.</div>` : ''}
    <div class="section-h">Look</div>
    <div class="group">${row({ icon:'paint', color:'#c2185b', lbl:'Template and colour', val: esc(TEMPLATES.find(t => t.id === doc.template)?.name), act:'preview' })}</div>
    <div style="height:20px"></div>`;
}
function totalsHTML(doc) {
  const k = calc(doc), ccy = clientCcy(doc);
  return `<div class="totals num">
    <div class="tr"><span>Subtotal${doc.taxMode === 'incl' ? ' (incl. tax)' : ''}</span><span>${money(k.sub, ccy)}</span></div>
    ${k.docDisc ? `<div class="tr"><span>Discount</span><span>−${money(k.docDisc, ccy)}</span></div>` : ''}
    ${k.taxList.map(t => `<div class="tr"><span>${doc.taxMode === 'incl' ? 'Includes ' : ''}${esc(t.name)} ${t.rate}%</span><span>${money(t.amount, ccy)}</span></div>`).join('')}
    ${k.ship ? `<div class="tr"><span>Shipping</span><span>${money(k.ship, ccy)}</span></div>` : ''}
    ${k.fees ? `<div class="tr"><span>Fees</span><span>${money(k.fees, ccy)}</span></div>` : ''}
    <div class="tr total"><span>Total</span><span class="num">${money(k.total, ccy)}</span></div></div>`;
}
const paySummary = () => { const p = D().biz.pay; return [p.account && 'Bank', p.paypal && 'PayPal', p.venmo && 'Venmo', p.cashapp && 'Cash App', p.zelle && 'Zelle', p.link && 'Pay link', p.qr && 'QR'].filter(Boolean).join(', ') || 'None added'; };

function edActions(doc) {
  const sendLbl = doc.type === 'receipt' ? 'Send receipt' : doc.status === 'sent' || doc.status === 'accepted' ? 'Send again' : 'Send';
  return `<div class="ed-actions">
    ${isPad() ? '' : `<button class="btn ghost" style="width:auto;flex:none;padding:0 18px" data-act="preview">${ic('eye', 20)}Preview</button>`}
    <button class="btn primary" data-act="send" id="sendbtn">${S.pro ? '' : ic('lock', 18, 2.2)}${sendLbl}</button></div>`;
}
function scrEditor(doc) {
  const more = `<button class="iconbtn" data-act="docMore" aria-label="More actions">${ic('more', 20)}</button>`;
  if (isPad()) {
    const left = S.device === 'ipad-p' ? backBtn(doc.type === 'estimate' ? docTitle(doc) + 's' : doc.type === 'receipt' ? 'Receipts' : 'Invoices') : `<button class="navbtn" data-act="toggleSidebar" aria-label="${S.ipadSidebar ? 'Hide sidebar' : 'Show sidebar'}">${ic('sidebar', 22)}</button>`;
    return `<div class="scr">${nav({ title:'', left, right: `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:12.5px;color:var(--ink-3)"><span class="kbd">⌘S</span> save <span class="kbd">⌘P</span> print</span>${more}</div>` })}
      <div class="edsplit"><div class="edcol"><div class="body" data-scroll-el="ed">${editorBody(doc)}</div>${edActions(doc)}</div>
      <div class="pvcol" data-scroll-el="pv"><div class="tpl-strip" style="padding:0;max-width:560px;width:100%">${tplStrip(doc, 64)}</div><div data-live="paper" style="width:100%;max-width:560px">${paper(doc, { watermark: !S.pro })}</div><p style="font-size:12.5px;color:var(--ink-3);margin:0">${S.pro ? 'Live PDF preview' : 'Live PDF preview. The "Preview" mark disappears with Premium.'}</p></div></div></div>`;
  }
  return `<div class="scr">${nav({ left: backBtn(S.docType === 'estimate' ? docTitle(doc) + 's' : doc.type === 'receipt' ? 'Receipts' : 'Invoices'), right: more })}
    <div class="body" data-scroll-el="ed">${editorBody(doc)}</div>${edActions(doc)}</div>`;
}
function tplStrip(doc, w = 96) {
  return TEMPLATES.map(t => `<button class="tpl" style="width:${w}px" aria-pressed="${doc.template === t.id}" data-act="tpl" data-arg="${t.id}"><span class="thumb" style="width:${w}px">${t.premium && !S.pro ? '<span class="lock">PRO</span>' : ''}${paper(doc, { template:t.id })}</span>${t.name}</button>`).join('');
}
function scrPreview(doc) {
  return `<div class="scr">${nav({ title:'Preview', left: backBtn('Edit'), right:`<button class="iconbtn" data-act="docMore" aria-label="More actions">${ic('more', 20)}</button>` })}
    <div class="body" data-scroll-el="pv">
      <div style="padding:6px 22px 14px" data-live="paper">${paper(doc, { watermark: !S.pro })}</div>
      ${S.pro ? '' : `<p style="text-align:center;font-size:12.5px;color:var(--ink-2);margin:0 24px 8px">The "Preview" mark is removed when you send with Premium.</p>`}
      <div class="section-h">Template</div><div class="tpl-strip">${tplStrip(doc)}</div>
      <div class="section-h">Colour</div><div class="swatches">${COLOURS.map(c => `<button class="swatch" style="background:${c}" aria-label="Colour ${c}" aria-pressed="${doc.color === c}" data-act="color" data-arg="${c}"></button>`).join('')}</div>
      <div style="height:16px"></div>
    </div>${edActions(doc)}</div>`;
}

function scrClients() {
  const q = S.cq.trim().toLowerCase();
  const list = visibleClients().filter(c => !q || c.name.toLowerCase().includes(q) || (c.contact || '').toLowerCase().includes(q));
  const right = `<button class="iconbtn" data-act="clientAdd" aria-label="Add client">${ic('plus', 20, 2.4)}</button>`;
  if (!visibleClients().length) return `<div class="scr">${nav({ large:'Clients', right })}<div class="body"><div class="empty"><span class="avatar" style="width:64px;height:64px">${ic('people', 30)}</span><h3>Add your first client</h3><p>Type their details or pick them from your Contacts. Invoice Maker only sees the contact you choose.</p><button class="btn primary" style="width:auto" data-act="contactPicker">${ic('contacts', 20)}Import from Contacts</button><button class="btn plain" style="width:auto" data-act="newClient">Type details</button></div></div></div>`;
  return `<div class="scr">${nav({ large:'Clients', right })}<div class="body" data-scroll-el="cl">
    <label class="search">${ic('search', 18)}<input id="search-clients" placeholder="Search clients" value="${esc(S.cq)}" data-in="ui:cq"></label><div style="height:10px"></div>
    <div class="group">${list.map(c => {
      const owed = visibleDocs().filter(d => d.clientId === c.id && d.type === 'invoice' && ['sent','overdue'].includes(statusOf(d))).reduce((a, d) => a + calc(d).total, 0);
      const sel = isPad() && cur()?.screen === 'client' && cur().id === c.id;
      return `<button class="docrow" data-act="openClient" data-arg="${c.id}" ${sel ? 'aria-current="true"' : ''}>${avatar(c.name)}<span style="flex:1;min-width:0"><div style="font-weight:600">${esc(c.name)}</div><div style="font-size:13px;color:var(--ink-2)">${esc(c.contact || c.email)}${c.currency !== D().biz.currency ? ' · ' + c.currency : ''}</div></span><span class="r">${owed ? `<span class="amt num" style="font-size:15px">${money(owed, c.currency)}</span><span style="font-size:12px;color:var(--ink-2)">owed</span>` : ''}</span></button>`;
    }).join('') || '<div class="empty"><p>No client matches that search.</p></div>'}</div></div></div>`;
}
function scrClient(c) {
  if (!c) return placeholder('Pick a client');
  const docs = visibleDocs().filter(d => d.clientId === c.id);
  return `<div class="scr">${nav({ title: isPad() ? '' : c.name, left: isPad() ? '' : backBtn('Clients') })}<div class="body" data-scroll-el="cd"><div class="readable">
    <div style="display:flex;gap:14px;align-items:center;margin:4px 16px 0">${avatar(c.name).replace('class="avatar"', 'class="avatar" style="width:56px;height:56px;font-size:20px"')}<div><div style="font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em">${esc(c.name)}</div><div style="color:var(--ink-2);font-size:14px">${docs.length} document${docs.length === 1 ? '' : 's'}</div></div></div>
    <div style="display:flex;gap:10px;margin:14px 16px 0"><button class="btn primary" data-act="newDocFor" data-arg="${c.id}">${ic('plus', 20, 2.4)}New invoice</button><button class="btn ghost" data-act="newEstFor" data-arg="${c.id}">New ${docTitle({type:'estimate'}).toLowerCase()}</button></div>
    <div class="section-h">Details</div><div class="group">
      ${inRow('Name', `client:${c.id}:name`, c.name)}${inRow('Contact', `client:${c.id}:contact`, c.contact, { ph:'Person' })}${inRow('Email', `client:${c.id}:email`, c.email, { type:'email', ph:'name@company.com' })}${inRow('Phone', `client:${c.id}:phone`, c.phone, { type:'tel' })}
      <label class="row" style="align-items:flex-start"><span class="k">Address</span><textarea id="f-caddr" rows="2" style="text-align:right" data-in="client:${c.id}:address">${esc(c.address)}</textarea></label>
      ${inRow('Tax ID', `client:${c.id}:taxId`, c.taxId, { ph:'Optional' })}
      <label class="row"><span class="k grow">Currency</span><select id="f-cccy" data-in="client:${c.id}:currency" style="text-align:right;flex:none">${['GBP','EUR','USD','AUD','CAD','NZD','CHF','JPY'].map(x => `<option ${x === c.currency ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    </div><div class="section-f">New invoices for ${esc(c.name)} use ${esc(c.currency)}.</div>

function lineTotalHTML(doc, it) {

/* ---------------- device scaling ---------------- */
function fit() {
  const dev = $('#dev'); if (!dev) return;
  const stage = $('#stage');
  const w = dev.offsetWidth, h = dev.offsetHeight;
  const narrow = window.innerWidth <= 900;
  const aw = stage.clientWidth - 8;
  const ah = narrow ? Infinity : window.innerHeight - 70;
  const s = Math.min(1, aw / w, ah / h);
  dev.style.transform = `scale(${s})`;
  $('#device').style.width = (w * s) + 'px';
  $('#device').style.height = (h * s) + 'px';
}

    if (how === 'Files' || how === 'Copy') { track('pdf_exported', { via:how }); S.sheets = []; render(); toast(how === 'Files' ? `Saved ${d.number}.pdf to Files` : 'PDF copied'); return; }
    if (d.status === 'draft') { d.status = d.type === 'receipt' ? 'paid' : 'sent'; }
    d.sentAt = TODAY;
    track(d.type === 'estimate' ? 'estimate_sent' : 'invoice_sent', { via:how });
    S.sheets = []; render(); toast(S.offline ? `${d.number} waiting in ${how}: sends when you have signal` : `${d.number} sent by ${how}`);
  },
  doPrint() { track('pdf_exported', { via:'Print' }); S.sheets = []; render(); toast('Sent to HP OfficeJet'); },
  savePdf() { const d = curDoc(); S.sheets = []; gate('invoice_export_pdf', () => { track('pdf_exported', { via:'Files' }); render(); toast(`Saved ${d.number}.pdf to Files`); }); render(); },
  printDoc() { const d = curDoc(); S.sheets = []; render(); gate('invoice_export_pdf', () => pushSheet({ type:'print', docId:d.id })); },
  markPaid() { const d = curDoc(); d.status = 'paid'; d.paidOn = TODAY; S.sheets = []; render(); toast(d.number + ' marked as paid'); },
  markUnpaid() { const d = curDoc(); d.status = d.sentAt ? 'sent' : 'draft'; d.paidOn = null; S.sheets = []; render(); toast('Marked as unpaid'); },
  makeReceipt() {
    const inv = curDoc(); S.sheets = [];
    const r = newDocument('receipt', inv.clientId, { items: clone(inv.items).map(i => ({ ...i, id:uid() })), taxMode:inv.taxMode, taxWhere:inv.taxWhere, totalTaxIds:[...inv.totalTaxIds], discount:{ ...inv.discount }, shipping:inv.shipping, fees:clone(inv.fees), paidOn: inv.paidOn || TODAY, notes:`Payment received for ${inv.number}. Thank you.`, template:inv.template, color:inv.color });
    openDoc(r.id); render(); toast('Receipt ' + r.number + ' ready to send');
  },
  duplicate() {
    const d = curDoc(); S.sheets = [];
    const copy = newDocument(d.type, d.clientId, { items: clone(d.items).map(i => ({ ...i, id:uid() })), taxMode:d.taxMode, taxWhere:d.taxWhere, totalTaxIds:[...d.totalTaxIds], discount:{ ...d.discount }, shipping:d.shipping, fees:clone(d.fees), notes:d.notes, template:d.template, color:d.color, job:d.job });
    openDoc(copy.id); render(); toast(`Duplicated as ${copy.number}`);
  },
  convert() {
    const e = curDoc(); S.sheets = [];
    e.status = 'converted';
    const inv = newDocument('invoice', e.clientId, { items: clone(e.items).map(i => ({ ...i, id:uid() })), taxMode:e.taxMode, taxWhere:e.taxWhere, totalTaxIds:[...e.totalTaxIds], discount:{ ...e.discount }, shipping:e.shipping, fees:clone(e.fees), job:e.job, template:e.template, color:e.color, fromEstimate:e.number });
    openDoc(inv.id); render(); toast(`${e.number} is now invoice ${inv.number}`);
  },
  clientSign() { const d = curDoc(); S.sheets = []; pushSheet({ type:'clientSign', docId:d.id }); },
  acceptSign() {
    const sh = topSheet(); const d = docById(sh.docId);
    const cv = document.querySelector('canvas[data-sig="client"]');
    if (!cv || !cv._drawn) { sh.err = true; render(); return; }
    d.clientSig = cv.toDataURL('image/png'); d.signedName = sh.name || clientById(d.clientId)?.contact || clientById(d.clientId)?.name || ''; d.signedOn = TODAY;
    if (d.type === 'estimate') d.status = 'accepted';
    S.sheets = []; render(); toast(d.type === 'estimate' ? 'Accepted and signed' : 'Signed by ' + d.signedName);
  },
  askDelete() { const d = curDoc(); S.sheets = []; pushSheet({ type:'confirm', title:`Delete ${d.number}?`, text:'This removes it from this iPhone and from iCloud. You can\'t undo this.', yes:'deleteDoc', yesLabel:'Delete', arg:d.id }); },
  deleteDoc(id) { D().docs = D().docs.filter(x => x.id !== id); S.sheets = []; S.stack = []; S.ipadSidebar = true; render(); toast('Deleted'); },

  /* paywall */
  plan(p) { topSheet().plan = p; render(); },
  toggleTrial() { const s = topSheet(); s.trial = !s.trial; render(); },
  buy() {
    const s = topSheet();
    if (S.offline) { toast('No connection. Try again when you\'re online.'); return; }
    pushSheet({ type:'buying', plan:s.plan, trial:s.plan === 'yearly' && s.trial });
  },
  confirmBuy() {
    const b = topSheet(); S.sheets.pop();
    const pw = topSheet();
    if (S.buyFails) { pw.failed = true; render(); return; }
    S.pro = true; S.trial = b.trial;
    track(b.trial ? 'trial_start' : 'purchase', { plan:b.plan });
    const then = pw && pw.then; S.sheets.pop();
    if (pw && pw.placement === 'onboarding_end') { S.onb = null; S.stack = []; S.tab = 'docs'; }
    render(); toast(b.trial ? 'Premium trial started' : 'Premium is on');
    if (then) setTimeout(then, 350);
    if (!S.signedIn && !then) setTimeout(() => pushSheet({ type:'signin' }), 600);
  },
  restore() { if (S.sheets.length && topSheet().type === 'paywall') S.sheets.pop(); render(); toast(S.pro ? 'Premium restored' : 'No purchases to restore on this Apple ID'); },
  closeSheet() {
    const s = topSheet();
    if (s && s.type === 'paywall' && s.revert) s.revert();
    if (s && s.type === 'signin' && s.then) { S.sheets.pop(); s.then(); return; }
    S.sheets.pop();
    if (s && s.type === 'paywall' && s.placement === 'onboarding_end') { S.onb = null; S.stack = []; S.tab = 'docs'; }
    render();
  },
  signin(from) { pushSheet({ type:'signin' }); },
  doSignin() {
    const s = topSheet();
    if (S.offline) { s.error = true; render(); return; }
    S.signedIn = true; S.sheets.pop(); track('login', { method:'apple' }); render(); toast('Signed in with Apple');
    if (s.then) setTimeout(s.then, 300);
  },
  skipSignin() { const s = topSheet(); S.sheets.pop(); render(); if (s.then) setTimeout(s.then, 200); },
  paywall(placement) { openPaywall(placement, false); },

  /* settings */
  toggleAnalytics() { S.analytics = !S.analytics; render(); },
  legal(which) { pushSheet({ type:'legal', which }); },
  toggleBiz(k) { D().biz[k] = !D().biz[k]; render(); },
  toggleQR() { D().biz.pay.qr = !D().biz.pay.qr; render(); },
  defTax(id) { D().biz.defaultTax = id; render(); },
  rmTax(id) { D().taxes = D().taxes.filter(t => t.id !== id); if (D().biz.defaultTax === id) D().biz.defaultTax = D().taxes[0]?.id || ''; render(); },
  addTax() { const id = uid(); D().taxes.push({ id, name:'Tax', rate:0 }); render(); setTimeout(() => document.getElementById('f-tn-' + id)?.select(), 30); },
  resetTax() { applyPreset(D().biz.country); render(); toast('Presets restored'); },
  bizTpl(id) { const t = TEMPLATES.find(x => x.id === id); if (t.premium && !S.pro) { openPaywall('template_premium', false); return; } D().biz.template = id; render(); },
  bizColor(c) { D().biz.brand = c; render(); },
  ccyDisp(k) { D().biz.currencyDisplay = k; render(); },
  fixIcloud() { S.icloudOff = false; render(); toast('iCloud backup is on'); },
  exportAll() { pushSheet({ type:'export' }); },
  exportGo(k) { S.sheets = []; render(); toast(k === 'zip' ? 'Invoices.zip saved to Files' : 'InvoiceMaker-data.csv saved to Files'); },
  manageSub() { pushSheet({ type:'manage' }); },
  cancelSub() { S.sheets = []; track('cancel', {}); S.pro = false; render(); toast('Cancelled. Your invoices stay yours.'); },
  delAccount() { pushSheet({ type:'confirm', title:'Delete your account?', text:'This removes your sign-in from our servers. Your invoices stay on this iPhone and in your iCloud until you delete them. It does not cancel your subscription; do that in Settings > Subscriptions.', yes:'delAccountYes', yesLabel:'Delete account' }); },
  delAccountYes() { S.signedIn = false; S.sheets = []; render(); toast('Account deleted'); },
  copyEmail() { const t = 'slice.of.life.ltd@gmail.com'; navigator.clipboard?.writeText(t).then(() => toast('Email copied'), () => toast(t)); },
  sendReport() { const m = document.getElementById('rp-msg'); if (!m.value.trim()) { m.focus(); m.style.borderColor = 'var(--due)'; return; } S.stack.pop(); render(); toast('Sent. We reply within 24 hours.'); },
  sigClear(which) { const cv = document.querySelector(`canvas[data-sig="${which}"]`); if (cv) { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); cv._drawn = false; } },
  sigSave() { const cv = document.querySelector('canvas[data-sig="biz"]'); if (!cv._drawn) { toast('Draw your signature first'); return; } D().biz.signature = cv.toDataURL('image/png'); S.stack.pop(); render(); toast('Signature saved'); },
  pickLogo(from) { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,.heic,.heif'; inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { D().biz.logo = r.result; render(); toast('Logo added'); }; r.onerror = () => toast('That file couldn\'t be read. Try a JPEG or PNG.'); r.readAsDataURL(f); }; inp.click(); },
  newItem() { pushSheet({ type:'item', isNew:true, item:{ id:uid(), desc:'', unit:'hour', rate:'', tax:D().biz.defaultTax } }); },
  editItem(id) { const i = D().items.find(x => x.id === id); pushSheet({ type:'item', isNew:false, item:i }); },
  itemTax(id) { topSheet().item.tax = id; render(); },
  saveItem() { const s = topSheet(); if (!s.item.desc.trim()) { document.getElementById('it-desc')?.focus(); return; } s.item.rate = +s.item.rate || 0; if (s.isNew) { if (S.empty) { S.empty = false; D().items = []; } D().items.push(s.item); } S.sheets.pop(); render(); toast(s.isNew ? 'Item added' : 'Item saved'); },
  delItem() { const s = topSheet(); D().items = D().items.filter(i => i.id !== s.item.id); S.sheets.pop(); render(); toast('Item deleted'); },

  /* onboarding */
  consent(v) { S.analytics = v === 'yes'; track('onboarding_step', { step:'consent' }); S.onb = 'welcome'; render(); },
  onbNext(step, el) {
    if (S.onb === 'role' && !S.onbData.role) return;
    if (step === 'first') {
      const o = S.onbData;
      if (o.name) D().biz.name = o.name;
      if (o.country && o.country !== D().biz.country) { D().biz.country = o.country; applyPreset(o.country); }
      o.client = o.client || (o.role === 'shop' ? 'Corner Deli' : 'Ruth Adeyemi');
      o.doc = sampleDoc(o.role || 'other', D().biz.name, o.client);
    }
    track('onboarding_step', { step });
    S.onb = step; render();
  },
  onbBack(step) { S.onb = step; render(); },
  onbRole(r) { S.onbData.role = r; render(); },
  onbFinish() {
    const o = S.onbData;
    if (S.empty) { S.empty = false; D().docs = []; D().clients = []; }
    let c = D().clients.find(x => x.name === o.client);
    if (!c) { c = { id:uid(), name:o.client, contact:'', email:'', phone:'', address:'', currency:D().biz.currency, taxId:'' }; D().clients.push(c); }
    const d = { ...o.doc, id:uid(), clientId:c.id, number: nextNumber('invoice') };
    delete d._client;
    D().docs.unshift(d);
    track('invoice_created', { source:'onboarding' }); track('onboarding_complete', { role:o.role });
    S.tab = 'docs'; S.docType = 'invoice'; S.stack = [{ screen:'doc', id:d.id }];
    openPaywall('onboarding_end', false);
    S.sheets[S.sheets.length - 1].afterOnb = true;
  },

  /* rail */
  device(k) { S.device = k; S.sheets = S.sheets.filter(s => s.type !== 'share'); if (k !== 'ipad-l') S.ipadSidebar = true; render(); },
  theme(k) { if (k === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k; render(); },
  railToggle(k) { S[k] = !S[k]; if (k === 'empty') { S.stack = []; S.sheets = []; } render(); },
  resetAll() { const dev = S.device; Object.assign(S, { data:seed(), pro:false, signedIn:false, empty:false, icloudOff:false, buyFails:false, offline:false, onb:null, onbData:{}, tab:'docs', docType:'invoice', filter:'all', q:'', cq:'', stack:[], sheets:[], events:[], signinAsked:false, ipadSidebar:true, errors:{} }); S.device = dev; render(); toast('Demo reset'); },
  jump(k) {
    S.sheets = []; S.onb = null; S.ipadSidebar = true;
    const inv = D().docs.find(d => d.type === 'invoice' && d.status === 'draft') || D().docs.find(d => d.type === 'invoice');
    const est = D().docs.find(d => d.type === 'estimate' && d.status === 'sent') || D().docs.find(d => d.type === 'estimate');
    const rec = D().docs.find(d => d.type === 'receipt');
    switch (k) {
      case 'onb': S.onbData = {}; S.onb = S.analytics === null || true ? 'consent' : 'welcome'; break;
      case 'onbFirst': S.onbData = { role:'contractor', name:D().biz.name }; ACT.onbNext('first'); return;
      case 'pwSoft': S.stack = []; S.tab = 'docs'; render(); openPaywall('onboarding_end', false); return;
      case 'home': S.tab = 'docs'; S.docType = 'invoice'; S.stack = []; break;
      case 'editor': openDoc(inv.id); break;
      case 'line': openDoc(inv.id); render(); ACT.editLine(inv.items[0].id); return;
      case 'preview': openDoc(inv.id); if (!isPad()) S.stack.push({ screen:'preview', id:inv.id }); break;
      case 'send': openDoc(inv.id); render(); ACT.send(); return;
      case 'share': openDoc(inv.id); render(); pushSheet({ type:'share', docId:inv.id }); return;
      case 'estimate': openDoc(est.id); break;
      case 'sign': openDoc(est.id); render(); pushSheet({ type:'clientSign', docId:est.id }); return;
      case 'signInv': openDoc(inv.id); render(); pushSheet({ type:'clientSign', docId:inv.id }); return;
      case 'receipt': openDoc(rec.id); break;
      case 'clients': S.tab = 'clients'; S.stack = []; break;
      case 'client': S.tab = 'clients'; S.stack = [{ screen:'client', id:D().clients[0].id }]; break;
      case 'items': S.tab = 'items'; S.stack = []; break;
      case 'settings': S.tab = 'settings'; S.stack = []; break;
      case 'taxes': S.tab = 'settings'; S.stack = [{ screen:'set-tax' }]; break;
      case 'payments': S.tab = 'settings'; S.stack = [{ screen:'set-pay' }]; break;
      case 'backup': S.tab = 'settings'; S.stack = [{ screen:'set-backup' }]; break;
      case 'help': S.tab = 'settings'; S.stack = [{ screen:'set-help' }]; break;
    }
    render();
  }
};
function applyPreset(country) {
  const p = PRESETS[country];
  D().taxes = p.taxes.map(([name, rate]) => ({ id: (name + rate).toLowerCase().replace(/[^a-z0-9]/g, ''), name, rate }));
  D().biz.defaultTax = D().taxes[0].id;
  D().biz.currency = p.currency;
}

/* ---------------- event wiring ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'DIV' && t.classList.contains('dim') && e.target !== t) return;
  e.preventDefault();
  const fn = ACT[t.dataset.act];
  if (fn) fn(t.dataset.arg, t, e);
});
document.addEventListener('input', e => {
  const el = e.target; const b = el.dataset && el.dataset.in; if (!b) return;
  const v = el.value;
  const [kind, a, c] = b.split(':');
  const num = x => x === '' ? '' : (isNaN(+x) ? x : +x);
  const d = curDoc();
  let full = false;
  switch (kind) {
    case 'ui': S[a] = v; full = true; break;
    case 'doc':
      if (a === 'discount.value') d.discount.value = num(v);
      else if (a === 'shipping') d.shipping = num(v);
      else d[a] = v;
      break;
    case 'fee': d.fees[+a][c] = c === 'amount' ? num(v) : v; break;
    case 'line': { const sh = topSheet(); const it = docById(sh.docId).items.find(i => i.id === a); it[c] = ['qty','rate','disc'].includes(c) ? num(v) : v; break; }
    case 'client': { const cl = clientById(a); cl[c] = v; if (c === 'currency') full = true; break; }
    case 'biz': D().biz[a] = a === 'dueDays' ? (+v || 0) : v; if (a === 'country') { applyPreset(v); full = true; } if (a === 'currency' || a === 'defaultTax') full = true; break;
    case 'pay': D().biz.pay[a] = v; break;
    case 'prefix': D().biz.prefix[a] = v; break;
    case 'next': D().biz.next[a] = Math.max(1, +v || 1); break;
    case 'tax': { const t = taxById(a); t[c] = c === 'rate' ? (+v || 0) : v; break; }
    case 'nc': topSheet().data[a] = v; break;
    case 'item': topSheet().item[a] = v; break;
    case 'cs': topSheet().name = v; break;
    case 'onb': {
      const o = S.onbData;
      if (a === 'name') o.name = v;
      if (a === 'country') o.country = v;
      if (a === 'client') o.client = v;
      if (a === 'item' && o.doc) o.doc.items[0].desc = v;
      if (a === 'price' && o.doc) o.doc.items[0].rate = num(v);
      break;
    }
  }
  if (kind === 'onb' && S.onb === 'first') {
    // the sample client is not a stored client; show the typed name on the preview
    const fake = { id:'__sample', name:S.onbData.client, address:'', currency:D().biz.currency };
    const real = D().clients; D().clients = [...real, fake]; refreshLive(); D().clients = real; return;
  }
  if (full) { if (kind === 'ui') { render(); } else render(); }
  else refreshLive();
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.in && (el.tagName === 'SELECT' || el.type === 'date')) render(); });
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); ACT.newDoc('invoice'); }
  if (k === 's') { e.preventDefault(); if (curDoc()) toast('Saved'); }
  if (k === 'p') { e.preventDefault(); if (curDoc()) ACT.printDoc(); }
});

/* signature pads */
function initSigPads() {
  document.querySelectorAll('canvas[data-sig]').forEach(cv => {
    if (cv._init) return; cv._init = true;
    const ctx = cv.getContext('2d'); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b2b4a';
    let drawing = false, last = null;
    const pt = ev => { const r = cv.getBoundingClientRect(); return { x:(ev.clientX - r.left) * cv.width / r.width, y:(ev.clientY - r.top) * cv.height / r.height }; };
    cv.addEventListener('pointerdown', ev => { drawing = true; last = pt(ev); cv.setPointerCapture(ev.pointerId); });
    cv.addEventListener('pointermove', ev => { if (!drawing) return; const p = pt(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; cv._drawn = true; });
    const end = () => { drawing = false; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  });
}

/* boot: first launch for a UK user starts at the analytics choice */
S.onb = 'consent';
render();
</script>
