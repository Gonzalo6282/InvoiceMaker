name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run on the newest Xcode, whose simulators are installed on the runner.
  test:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Find newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          echo "XC_LATEST=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
          echo "::notice title=Tests use::$(basename "$LATEST")"

      - name: InvoiceKit tests
        if: success() || failure()
        run: |
          export DEVELOPER_DIR="$XC_LATEST"
          swift test --package-path Packages/InvoiceKit --enable-code-coverage 2>&1 | tee swift-test.log
          STATUS=${PIPESTATUS[0]}
          grep -E "✘|error:" swift-test.log | sort -u | head -9 | while IFS= read -r l; do echo "::error title=InvoiceKit::$l"; done
          [ $STATUS -ne 0 ] && exit $STATUS
          python3 scripts/ci-coverage.py "$(swift test --package-path Packages/InvoiceKit --show-codecov-path)" 0

      - name: App tests (iPhone)
        if: success() || failure()
        run: DEVELOPER_DIR="$XC_LATEST" scripts/ci-xcode-test.sh iPhone "iPhone 17 Pro"

      - name: App tests (iPad)
        if: success() || failure()
        run: DEVELOPER_DIR="$XC_LATEST" scripts/ci-xcode-test.sh iPad "iPad Air 11-inch (M3)"

  # Same Xcode as Gonzalo's Mac (26.1.1): everything must compile with it.
  # The runner lacks the iOS 26.1 platform, so it is downloaded first.
  compile-xcode-26-1:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.1
        run: |
          MAC=$(ls -d /Applications/Xcode_26.1*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$MAC/Contents/Developer" >> "$GITHUB_ENV"
          echo "::notice title=Compile check::$(basename "$MAC")"

      - name: Compile app, tests and InvoiceKit
        run: |
          swift build --package-path Packages/InvoiceKit --build-tests
          build() {
            xcodebuild build-for-testing -project InvoiceMaker.xcodeproj -scheme InvoiceMaker \
              -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO > build-mac.log 2>&1
          }
          if ! build; then
            if grep -q "is not installed" build-mac.log; then
              echo "::notice::iOS platform missing for this Xcode; downloading it"
              xcodebuild -downloadPlatform iOS > download.log 2>&1 \
                || { tail -6 download.log | while IFS= read -r l; do echo "::error title=downloadPlatform::$l"; done; exit 1; }
              build || true
            fi
          fi
          if grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build-mac.log; then
            echo "Compiled OK with $(xcodebuild -version | head -1)"
          else
            grep -E "error:" build-mac.log | sort -u | head -9 | while IFS= read -r l; do echo "::error title=compile 26.1::$l"; done
            tail -40 build-mac.log; exit 1
          fi
