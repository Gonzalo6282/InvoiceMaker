name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.1 (matches the Mac)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26.1*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_26*.app | sort -V | head -1); echo "::warning::Xcode 26.1 not found, using $XC"; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          swift --version

      - name: InvoiceKit tests
        run: swift test --package-path Packages/InvoiceKit --enable-code-coverage

      - name: App tests (iPhone)
        run: scripts/ci-xcode-test.sh iPhone "iPhone 17 Pro"

      - name: App tests (iPad)
        if: success() || failure()
        run: scripts/ci-xcode-test.sh iPad "iPad Air 11-inch (M3)"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/*.xcresult
          retention-days: 7
